server:
  port: 8082

spring:
  application:
    name: expense-service

  datasource:
    url: jdbc:mysql://localhost:3306/spendwise_expense?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2006}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: false

jwt:
  secret: ${JWT_SECRET:SpendWise-Super-Secret-Key-That-Is-At-Least-256-Bits-Long-For-Security}
  expiration: 86400000

# Where to store uploaded receipt files on disk
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads/receipts}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

